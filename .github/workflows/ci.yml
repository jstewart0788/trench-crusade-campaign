name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every JSON under data/ parses
        run: |
          set -e
          find data -name '*.json' -print0 | xargs -0 -n1 python3 -I -m json.tool > /dev/null
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua for luac -p
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - run: pnpm mod:build
      - run: pnpm mod:verify
      - run: pnpm mod:test
